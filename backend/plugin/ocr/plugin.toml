[plugin]
summary = 'OCR'
version = '0.0.1'
description = '图片文字识别插件'
author = 'wu-clan'
tags = ['other']
database = ['mysql', 'postgresql']

[app]
router = ['v1']

[settings]
OCR_PROVIDER = 'llama_parse'
OCR_DOCUMENT_PROVIDER = 'llama_parse'
OCR_IMAGE_MAX_COUNT = 3
OCR_REQUEST_TIMEOUT = 20
OCR_TOKEN_REDIS_PREFIX = 'fba:ocr:token'
OCR_LLAMA_CLOUD_API_KEY = ''
OCR_LLAMA_POLL_INTERVAL_SECONDS = 60
OCR_LLAMA_MAX_POLL_ATTEMPTS = 30
OCR_LLAMA_REQUEST_RETRY_COUNT = 3
OCR_LLAMA_REQUEST_RETRY_DELAY_SECONDS = 5
OCR_LLAMA_CONNECT_TIMEOUT = 30
OCR_LLAMA_READ_TIMEOUT = 300
OCR_LLAMA_WRITE_TIMEOUT = 300
OCR_LLAMA_POOL_TIMEOUT = 30
OCR_LLAMA_TIER = 'agentic'
OCR_LLAMA_VERSION = 'latest'
OCR_LLAMA_CUSTOM_PROMPT = '你是一个专业的文档 OCR 和结构化解析助手。请完整保留公式、题目描述、选项内容、图片和表格位置。遇到复杂表格时优先保留为图片或稳定的版式内容。'
OCR_LLAMA_EXPAND = 'markdown_full,text_full'
OCR_LLAMA_IMAGES_TO_SAVE = 'embedded'
OCR_LLAMA_SAVE_IMAGES = true
OCR_LLAMA_DOWNLOAD_IMAGES = false
OCR_LLAMA_INLINE_IMAGES = true
OCR_LLAMA_TABLES_AS_MARKDOWN = true
OCR_LLAMA_MERGE_CONTINUED_TABLES = true
OCR_LLAMA_IGNORE_DIAGONAL_TEXT = true
OCR_LLAMA_IGNORE_TEXT_IN_IMAGE = false
OCR_LLAMA_IGNORE_HIDDEN_TEXT = true
OCR_LLAMA_LANGUAGES = 'ch_sim,en'
OCR_LLAMA_COST_OPTIMIZER_ENABLED = true

BAIDU_OCR_HANDWRITING_URL = 'https://aip.baidubce.com/rest/2.0/ocr/v1/handwriting'
BAIDU_OCR_ACCURATE_BASIC_URL = 'https://aip.baidubce.com/rest/2.0/ocr/v1/accurate_basic'
BAIDU_OCR_GENERAL_BASIC_URL = 'https://aip.baidubce.com/rest/2.0/ocr/v1/general_basic'
BAIDU_OCR_SUBJECTIVE_FALLBACK_ENABLED = true
