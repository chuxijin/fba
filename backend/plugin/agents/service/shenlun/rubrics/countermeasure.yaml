version: "1"
description: "提出对策题评分细则 - 针对性/可行性/全面性/操作性四维度, 总分 10"
total: 10
grade_labels:
  A: 优秀
  B: 良好
  C: 合格
  D: 不合格
dimensions:
  - name: 针对性
    max_score: 3
    weight: 0.30
    levels:
      A: 对策与问题一一对应, 精准切中要害
      B: 对策能针对主要问题, 部分有错位
      C: 对策方向偏宽泛, 与问题对应较松
      D: 对策与问题脱节或答非所问
  - name: 可行性
    max_score: 3
    weight: 0.30
    levels:
      A: 对策切实可行, 符合现实条件与法规
      B: 对策基本可行, 实施障碍较小
      C: 对策可行性存疑, 部分难落地
      D: 对策空泛口号或不符合现实
  - name: 全面性
    max_score: 2
    weight: 0.20
    levels:
      A: 覆盖问题各主要方面, 体系完整
      B: 覆盖主要方面, 个别遗漏
      C: 覆盖面较窄, 多处遗漏
      D: 仅触及单一方面或要点过少
  - name: 操作性
    max_score: 2
    weight: 0.20
    levels:
      A: 对策具体可操作, 有抓手、有路径
      B: 对策较为具体, 有大致实施方向
      C: 对策偏抽象, 缺乏具体操作步骤
      D: 对策为口号(如"加强管理")无操作性
