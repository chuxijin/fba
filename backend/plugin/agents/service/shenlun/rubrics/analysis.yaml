version: "1"
description: "综合分析题评分细则 - 观点/分析深度/逻辑/语言四维度, 总分 10"
total: 10
grade_labels:
  A: 优秀
  B: 良好
  C: 合格
  D: 不合格
dimensions:
  - name: 观点
    max_score: 3
    weight: 0.30
    levels:
      A: 观点准确, 抓住材料核心关键, 立场鲜明
      B: 观点基本准确, 与材料主旨契合
      C: 观点尚可, 略有偏差或未点透关键
      D: 观点偏题或仅做表面复述
  - name: 分析深度
    max_score: 4
    weight: 0.40
    levels:
      A: 多角度深入剖析, 揭示本质, 有自己的判断
      B: 能从多个角度分析, 论证较有深度
      C: 分析角度单一或停留在现象层面
      D: 仅做现象罗列, 无实质分析
  - name: 逻辑
    max_score: 2
    weight: 0.20
    levels:
      A: 论证逻辑严密, 因果清晰, 层次分明
      B: 论证逻辑基本清晰
      C: 论证逻辑松散, 部分跳跃
      D: 逻辑混乱或自相矛盾
  - name: 语言
    max_score: 1
    weight: 0.10
    levels:
      A: 用词精准, 表达简洁有力
      B: 用词基本规范, 表达清晰
      C: 用词偶有不当, 表达略平淡
      D: 病句较多或表达不清
