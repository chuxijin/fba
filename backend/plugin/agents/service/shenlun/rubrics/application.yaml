version: "1"
description: "应用文写作评分细则 - 格式/对象/任务/语言四维度, 总分 15"
total: 15
grade_labels:
  A: 优秀
  B: 良好
  C: 合格
  D: 不合格
dimensions:
  - name: 格式
    max_score: 4
    weight: 0.27
    levels:
      A: 格式完全规范(标题/称呼/正文/落款/日期等齐全且位置正确)
      B: 格式基本规范, 个别要素瑕疵
      C: 格式有明显缺失或位置错误
      D: 格式完全错误或缺失大量要素
  - name: 对象
    max_score: 3
    weight: 0.20
    levels:
      A: 准确把握行文对象(领导/同事/群众/外部单位), 语气立场贴切
      B: 基本符合对象身份, 个别用词不当
      C: 对象意识较弱, 语气位置有偏差
      D: 完全无对象意识或语气严重失当
  - name: 任务
    max_score: 5
    weight: 0.33
    levels:
      A: 全面完成题目所列任务要点, 重点突出
      B: 完成大部分任务要点, 个别遗漏
      C: 完成部分任务要点, 多处遗漏
      D: 任务完成度差或答非所问
  - name: 语言
    max_score: 3
    weight: 0.20
    levels:
      A: 用语得体, 公文味浓, 表达精准
      B: 用语基本得体, 表达清晰
      C: 用语偶有口语化或不准确
      D: 病句较多或语体不符
