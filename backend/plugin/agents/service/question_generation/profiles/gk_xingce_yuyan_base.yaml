version: "0.1"
exam: gk
subject: xingce
section: yuyan
name: 国考行测言语理解命题规则画像
principles:
  - 只基于题干、设问、选项与答案抽取命题规律，不把解析和标签链当作命题依据。
  - 先判断素材结构，再决定题型；不能把所有素材都强行出题。
  - 题目质量核心在题眼和选项陷阱，错误项必须错得有依据。
material_rules:
  suitable:
    - 有稳定中心话题和可回扣的结论句。
    - 有转折、因果、递进、并列、举例、对比等结构节点。
    - 有可以被概括、挖空、排序或细节篡改的信息。
  unsuitable:
    - 只有事实堆叠，没有观点、机制、结论或对策。
    - 信息过短导致语境不足。
    - 全文只有单一事实，无法设置相近干扰项。
passage_length_rules:
  logical_cloze:
    min_chars: 140
    max_chars: 165
    note: 逻辑填空集中在 140-165 字，太短语境不足，太长空位约束发散。
  passage_reading:
    min_chars: 230
    max_chars: 260
    applies_to:
      - main_idea
      - intent
      - title
      - detail
    note: 片段阅读集中在 230-260 字，是主旨、意图、标题、细节题的标准化长度带。
  sentence_completion:
    min_chars: 180
    max_chars: 240
    note: 语句填空需要前后衔接，片段过短缺少回扣点，过长会引入多重话题。
  sentence_reorder:
    min_chars: 260
    max_chars: 320
    note: 语句排序通常最长，约 260-320 字，需要能拆成 5-6 个句子，标准形态接近 6 句。
example_roles:
  - 前置引入例：不能把例子本身当主旨。
  - 中置支撑例：干扰项可抓例子形成局部正确。
  - 后置落点例：下文推断可沿尾部话题展开。
  - 对比例：选项可偷换对比双方或只取一方。
question_types:
  logical_cloze:
    focus:
      - 空位所在的上下文对应。
      - 搭配对象、语义轻重、感情色彩、文体正式度。
      - 多空题需要一个突破口空和一个验证空。
    distractors:
      - 语义接近但侧重点错。
      - 局部可解释但无法贯通全文。
      - 搭配对象不自然。
      - 语义程度过重或过轻。
  main_idea:
    focus:
      - 转折后、结论词后、对策句、递进后一层、尾句总结。
      - 正确项是核心句同义压缩，不直接复制原文。
    distractors:
      - 抓背景不抓结论。
      - 抓例子不抓观点。
      - 抓手段不抓目的。
      - 话题过宽或过窄。
  title:
    focus:
      - 覆盖中心话题且像标题。
      - 有概括性，但不能标题党。
    distractors:
      - 太宽、太窄、太实、太虚。
      - 只抓局部事实或例子。
  sentence_completion:
    focus:
      - 必须同时说明前文回扣点和后文回扣点。
      - 居首总领，居中承上启下，居末总结或推出结论。
    distractors:
      - 前文能接但后文接不上。
      - 后文能接但前文没铺垫。
      - 话题一致但逻辑关系错。
  sentence_reorder:
    focus:
      - 必须能拆成 5-6 个独立排序句。
      - 首句、尾句、代词指代、关联词、时间顺序或逻辑递进至少形成两类排序线索。
    distractors:
      - 只依据单一关联词形成局部顺序。
      - 代词或指代对象错位。
      - 首尾句错置导致话题起落不自然。
  detail:
    focus:
      - 每个选项必须能定位原文依据。
      - 错项通过主体、范围、数量、时间、因果、条件、程度、概念进行微型篡改。
quality_checks:
  - 正确答案唯一。
  - 正确项必须能从原文推出，不能依赖外部常识。
  - 三个错误项必须有明确错误原因。
  - 选项长度、抽象层级、语气尽量接近。
  - 不能照搬真题，不能大量复刻素材原句。
  - 命题蓝图必须说明题眼、正确项策略和干扰项策略。
