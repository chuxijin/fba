user_answer_text: |
  做事要学会变通

  材料里面说做事要有合适的章法，我觉得意思就是做事情要学会变通，不能死板。不管做什么事情，一成不变是不行的，懂得变通才能成功。

  就像材料里的剪刀厂，一开始一直用手工做剪刀，卖不出去，后来变通改成机器生产，就赚钱了。还有家具厂不变通，最后倒闭了。所以做人做事一定要学会改变，不能一直守着老方法不放。

  不光工厂需要变通，政府工作也需要变通。比如养老机构检查，不能直接全部关掉，要灵活一点。城市装路灯也要灵活一点，不要灯光太亮造成污染。只要学会变通，所有问题都能解决。

  所以我们生活中也要学会变通，遇到问题不要钻牛角尖，换一种方法就能解决问题。懂得变通，未来才能越来越好。

