# 申论·大作文样卷模板
# 此文件用于人肉抽检 (Task 13) 的样卷输入, mock 端到端测试不需要真内容
#
# 准备说明:
# 1. agent_type / provider_id / model_id / score_total 是固定配置, 一般不改
# 2. user_id 填你自己的测试账号 ID
# 3. question_stem (题干, 100-500 字):
#    描述题目背景, 例如"假定你是某市发改委工作人员, 收到一份调研报告, 反映..."
# 4. question (题目要求, 50-200 字):
#    具体写作任务, 例如"请就当前区域协同发展中的问题, 写一篇议论文, 不少于 800 字, 不超过 1200 字"
# 5. materials (给定材料, 2000-5000 字):
#    公考申论的"材料 1/2/3..."部分, 通常 3-5 段, 涵盖题目所需的信息
#    建议保留原始材料的"段落编号"或"材料 N"分隔, 便于 LLM 引用
# 6. reference_answers (3 份参考答案, 每份 800-1200 字):
#    建议来源: 高分作文/标准答案/真题答案集
#    多份参考答案让 reference_analyzer 节点能算出共识度, 而不是 1 份的"标准答案专政"
# 7. user_answer_text (学生作答, 800-1200 字):
#    一份真实学生作文 (脱敏后), 用于跑全流程批改

agent_type: shenlun
user_id: 1
provider_id: 5
model_id: mimo-v2.5-pro
score_total: 40
question_stem: |
  [此处填写题干, 100-500 字]

  示例: 假定你是 H 市发改委的一名工作人员, 近期市委决定推进与周边城市的协同发展,
  调研结果反映出制度协同不足、产业同质化竞争、民生保障跟不上等问题。
  现请你结合给定材料, 谈谈你对协同发展的认识与建议。
question: |
  [此处填写题目要求, 50-200 字]

  示例: 请以"协同发展之要义"为题, 写一篇议论文。
  要求: 立意明确, 思路清晰, 论证有力, 不少于 800 字, 不超过 1200 字。
materials: |
  [此处填写给定材料, 2000-5000 字, 建议保留材料编号]

  材料 1
  长三角一体化发展上升为国家战略以来, 三省一市深化制度协同, 推出了一系列跨域政策...

  材料 2
  ...

  材料 3
  ...
reference_answers:
  - |
    [参考答案 1, 800-1200 字]

    协同发展之要义, 在于制度先行、产业同频、民生为本。首先, 制度协同是基础...
  - |
    [参考答案 2, 800-1200 字]

    协同发展是新时代区域发展的必由之路。要做好协同, 需要从三个维度入手...
  - |
    [参考答案 3, 800-1200 字]

    推进区域协同发展, 关键在于打破行政壁垒。当前, 长三角、京津冀等地区...
user_answer_text: |
  [学生作答, 800-1200 字]

  在区域协同发展的过程中, 我认为最重要的是制度协同。只有把制度建好了, 才能让...

