question_type: 应用文

question_stem: |
  某市老龄化程度持续加深, 60 岁以上老年人口占比达 24.3%。大部分老年人选择居家养老,
  但老旧小区存在楼道无扶手、地面湿滑、照明不足、无障碍设施缺失等问题, 老年人出行和
  居家存在安全隐患。市政府决定在全市推进社区适老化改造工程。

question: |
  假设你是市民政局工作人员, 请草拟一份《关于推进社区适老化改造的工作方案》。
  要求: 格式规范, 内容完整, 措施具体, 不超过 500 字。

materials: |
  ## 材料 1

  某区前期试点适老化改造, 主要内容包括: 在楼道安装扶手、增设防滑地砖、改善照明条件;
  在老年人家庭内部安装浴室扶手、防滑垫、紧急呼叫装置; 在小区道路增设无障碍坡道、
  休息座椅。

  试点中发现的问题: 一是居民意见不统一, 低层住户不愿分摊费用; 二是改造标准不统一,
  各施工队质量参差不齐; 三是后期维护责任不清, 设施损坏后无人维修。

  ## 材料 2

  某市出台《老旧小区改造指导意见》, 明确适老化改造纳入老旧小区改造范畴, 资金来源
  为"政府补一点、居民出一点、社会捐一点"。具体标准: 政府补贴不超过改造总费用的 60%,
  单户最高补贴 5000 元; 公共区域改造由政府全额承担。

  某街道探索"居民议事会"模式, 由社区居委会组织居民代表、业委会、施工单位共同商议
  改造方案, 取得较好效果。居民代表李阿姨说: "方案是大家商量出来的, 执行起来阻力小多了。"

  ## 材料 3

  某区建立"改造后评估"机制, 改造完成后由第三方机构进行质量验收, 并入户调查老年人
  使用满意度。评估结果作为后续改造项目的重要参考。

  某社区建立"适老化设施维护基金", 每户每年缴纳 50 元, 加上社区公共收益补充, 专项
  用于设施日常维护。社区书记说: "三分建设、七分管理, 没有维护机制, 改造效果会大打折扣。"

reference_answers:
  # 参考答案 1 (规范格式高分版)
  - |
    关于推进社区适老化改造的工作方案

    为改善老年人居家和出行环境, 提升社区适老化水平, 根据市政府部署, 制定本方案。

    一、工作目标
    2026 年底前, 完成全市 100 个老旧小区适老化改造, 惠及老年人家庭 2 万户。

    二、改造内容
    (一)公共区域: 安装楼道扶手、增设防滑地砖、改善照明、增设无障碍坡道和休息座椅。
    (二)家庭内部: 安装浴室扶手、防滑垫、紧急呼叫装置。

    三、资金保障
    采取"政府补一点、居民出一点、社会捐一点"模式。政府补贴不超过改造总费用的 60%,
    单户最高补贴 5000 元; 公共区域改造由政府全额承担。

    四、实施步骤
    (一)摸底调查(2026 年 6 月底前): 完成老旧小区老年人口和设施现状摸底。
    (二)方案制定(2026 年 7-8 月): 通过"居民议事会"商议改造方案。
    (三)施工改造(2026 年 9-11 月): 统一标准、规范施工。
    (四)验收评估(2026 年 12 月): 第三方质量验收, 入户满意度调查。

    五、保障措施
    (一)建立维护基金: 每户每年缴纳 50 元, 专项用于设施日常维护。
    (二)加强组织领导: 成立工作专班, 明确各部门职责。
    (三)强化监督考核: 将适老化改造纳入年度考核。

    市民政局
    2026 年 5 月 27 日

  # 参考答案 2 (简洁实用高分版)
  - |
    关于推进社区适老化改造的工作方案

    一、目标: 2026 年底前完成 100 个老旧小区适老化改造。

    二、内容: 公共区域安装扶手、防滑地砖、无障碍坡道; 家庭内部安装浴室扶手、紧急
    呼叫装置。

    三、资金: "三个一点"模式, 政府补贴不超过 60%, 单户最高 5000 元, 公共区域政府
    全额承担。

    四、步骤: 摸底调查(6 月)→ 居民议事商议方案(7-8 月)→ 施工改造(9-11 月)→
    验收评估(12 月)。

    五、保障: 建立维护基金(每户每年 50 元); 成立工作专班; 纳入年度考核。

    市民政局
    2026 年 5 月 27 日

  # 参考答案 3 (详细版高分版)
  - |
    关于推进社区适老化改造的工作方案

    为贯彻落实市政府关于推进社区适老化改造的部署要求, 改善老年人居家和出行环境,
    特制定本方案。

    一、工作目标
    2026 年底前, 完成全市 100 个老旧小区适老化改造, 惠及老年人家庭 2 万户, 打造
    10 个适老化改造示范社区。

    二、改造内容
    (一)公共区域改造
    1. 楼道安装双侧扶手, 高度 0.85-0.9 米;
    2. 楼道、台阶增设防滑地砖;
    3. 改善楼道照明, 增设声控灯;
    4. 小区道路增设无障碍坡道, 坡度不大于 1:12;
    5. 休闲区域增设带扶手休息座椅。

    (二)家庭内部改造
    1. 浴室安装 L 型扶手, 铺设防滑垫;
    2. 卧室、卫生间安装紧急呼叫装置;
    3. 厨房安装燃气报警器。

    三、资金保障
    采取"三个一点"筹资模式。政府补贴不超过改造总费用的 60%, 单户最高补贴 5000 元;
    公共区域改造由政府全额承担; 鼓励社会资本捐赠。

    四、实施步骤
    (一)摸底调查阶段(2026 年 6 月底前): 完成老旧小区老年人口和设施现状调查。
    (二)方案制定阶段(2026 年 7-8 月): 通过"居民议事会"商议改造方案, 统一施工标准。
    (三)施工改造阶段(2026 年 9-11 月): 规范施工, 加强质量监管。
    (四)验收评估阶段(2026 年 12 月): 第三方质量验收, 入户满意度调查。

    五、保障措施
    (一)建立长效维护机制。设立适老化设施维护基金, 每户每年缴纳 50 元, 专项用于
    设施日常维护。
    (二)加强组织领导。成立市适老化改造工作专班, 明确民政、住建、财政等部门职责。
    (三)强化监督考核。将适老化改造纳入年度考核, 定期督查通报。

    市民政局
    2026 年 5 月 27 日

