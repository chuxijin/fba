question_stem: |
  近年来, 各级政府持续推动基层减负, 取得一定成效, 但形式主义问题在一些地方仍不同程度存在。
  有基层干部反映, "文山会海"有所减少, 但"指尖上的形式主义"又冒了头; 一些地方考核指标
  越来越细, 基层干部疲于填表报数; 有的地方把"痕迹管理"异化为"痕迹主义", 重留痕轻实绩。

question: |
  请根据给定资料, 谈谈你对"基层形式主义"的理解。
  要求: 观点明确, 分析透彻, 逻辑清晰, 不超过 350 字。

materials: |
  ## 材料 1

  某县推行"数字化治理"后, 基层干部手机上安装了 10 多个政务 APP, 每个 APP 都要打卡签到、
  上传照片、填写日志。某社区书记老张说: "以前是跑断腿, 现在是盯瞎眼。一天光填 APP 就要
  花两三个小时, 真正走访群众的时间反而少了。"该县组织部调研发现, 全县 200 多名社区干部,
  平均每天在各类 APP 上花费 2.5 小时, 其中 40% 的内容属于重复填报。

  市级部门年终考核时, 考核组要求提供"工作留痕"材料。某乡镇准备了 12 盒台账, 涵盖会议记录、
  活动照片、签到表、简报等。考核组翻看后说: "材料很齐全, 但群众满意度怎么样?"乡镇干部
  一时语塞。事后该乡镇党委书记感叹: "我们花大量精力在'造痕迹'上, 真正解决群众问题的
  时间被严重挤压。"

  ## 材料 2

  某市推行"基层减负年"以来, 市级发文数量减少 30%, 会议压缩 25%。但基层干部反映,
  "文件少了, 微信群多了; 会议短了, 督查频繁了"。某街道办事处主任统计, 他所在的街道
  共有 47 个工作微信群, 平均每天收到 200 多条工作消息, 很多需要"收到"回复并附上落实照片。

  省级督查组在某县检查时发现, 该县为迎接检查, 提前一周组织干部"补材料"。一位参与补材料的
  干部透露: "很多工作其实做了, 但没有及时记录。检查组要看痕迹, 我们只能'回忆式'补录。"
  督查组组长后来反思: "如果检查变成了'查材料', 那基层自然会把精力放在'造材料'上。"

  ## 材料 3

  某镇推行"无会周"制度, 每月第三周不安排会议。但执行中出现变通: 有的部门把"会议"改名为
  "工作调度""碰头会""座谈会", 名义上无会, 实际照开。该镇纪委书记发现后, 在全镇通报批评,
  并明确"无会周"不区分会议名称, 所有集体性工作部署均纳入范围。

  某县探索"反向考核": 让基层干部给上级部门打分, 评价上级部门布置任务的合理性、指导的精准性。
  首次考核结果显示, 基层对"考核指标过多过细"的意见最集中。该县据此精简考核指标 40%,
  并将"群众满意度"权重从 15% 提升至 40%。

  基层干部小李说: "减负不是减责任, 我们不怕干实事, 就怕干虚事。希望上级多看实效少看痕迹,
  多问群众少问表格。"

reference_answers:
  # 参考答案 1 (分层递进式高分版)
  - |
    基层形式主义是指基层工作中重形式轻内容、重过程轻结果、重痕迹轻实效的不良作风。
    其本质是用"形式"替代"实质", 用"留痕"替代"落实", 导致基层干部精力被消耗在
    无效劳动上, 削弱了服务群众的能力。

    形式主义产生有多重原因: 一是考核导向偏差, 上级重"痕迹"轻"实效", 基层被迫
    "造材料"; 二是技术工具异化, APP、微信群等本为提效, 却沦为新的负担; 三是层层
    加码传导, 上级减负政策到基层走样变味。

    治理基层形式主义需要标本兼治: 转变考核导向, 以群众满意度为核心; 精简技术工具,
    避免"指尖上的负担"; 建立反向考核机制, 让基层对上级有话语权。

  # 参考答案 2 (问题-原因-对策三段式高分版)
  - |
    基层形式主义是当前基层治理中的突出问题。具体表现为: "指尖上的形式主义"——基层
    干部日均花 2.5 小时在 APP 上; "痕迹主义"——重留痕轻实绩, 12 盒台账换不来群众
    满意; "变通执行"——无会周变成"改名会"。

    原因在于: 考核导向重形式轻内容, 技术工具异化为新负担, 减负政策层层走样。

    对策是: 精简考核指标, 提升群众满意度权重; 整合政务 APP, 避免重复填报; 推行反向
    考核, 让基层对上级有评价权; 严查变通执行, 确保减负落地。

  # 参考答案 3 (辩证分析式高分版)
  - |
    基层形式主义问题需辩证看待。一方面, 数字化治理、痕迹管理的初衷是提升效能、规范
    执行, 有其合理性; 另一方面, 执行中出现异化——APP 变负担、痕迹变主义、会议变
    "改名", 说明制度设计与基层实际脱节。

    问题根源不在技术本身, 而在考核导向和治理逻辑。当上级以"查材料"代替"查实效",
    基层必然以"造痕迹"代替"干实事"。

    破解之道在于重构考核体系: 以群众满意度为核心指标, 推行反向考核, 让基层有发言权;
    同时精简技术工具, 避免"为数字化而数字化"。减负不是减责任, 而是让基层干部把精力
    用在刀刃上。

# B 档水平学生作答 (观点基本正确, 分析较浅, ~300 字)
user_answer_text: |
  基层形式主义是指基层工作中重形式轻内容的现象。当前基层形式主义主要表现为:
  一是"指尖上的形式主义", 基层干部手机上 APP 过多, 每天花费大量时间打卡填表;
  二是"痕迹主义", 迎接检查需要准备大量台账材料, 重留痕轻实绩; 三是变通执行,
  如"无会周"被改名为"碰头会"规避。

  产生形式主义的原因主要有: 考核导向偏差, 上级过于重视痕迹材料; 技术工具异化,
  本应提效的 APP 反而成为负担; 减负政策在执行中走样变味。

  解决基层形式主义问题, 需要转变考核导向, 以群众满意度为核心; 精简政务 APP,
  避免重复填报; 建立反向考核机制, 让基层干部对上级部门有评价权。同时要加强监督,
  严查变通执行行为, 确保减负政策真正落地。

