# D 档对照样本: 字数严重不足 (330 字 vs 要求 800+) + 立意空泛 + 零材料引用
# 期望评分: <15/40 [D/四类卷], 缺失 5+ 要点
user_answer_text: |
  协同发展之要义

  协同发展是现在很重要的发展战略。我们国家提出了京津冀协同发展、长三角一体化、粤港澳大湾区
  建设等多个区域战略, 都是为了让地方发展得更好。

  协同发展可以促进经济增长。各个地方一起搞建设, 比一个地方单独搞要好得多。例如长三角的发展
  就是协同的好例子, 那里有很多企业, 经济也比较发达。

  协同发展也可以方便人民生活。例如可以异地就医、异地办事等等。这对老百姓来说非常方便。

  但是协同发展也有一些问题。比如各地的政策不一样、利益不一致等, 这些都需要协调。我们应该
  加强协同, 争取让更多的地方参与进来, 让大家都过上好日子。

  总之, 协同发展非常重要, 我们应该继续推进。希望国家在未来能把协同发展做得更好, 让人民群众
  有更多获得感。
