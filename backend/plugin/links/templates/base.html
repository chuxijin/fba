<!DOCTYPE html>
<html lang="zh-CN" data-theme="{{ 'dark' if dark_theme else 'light' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="format-detection" content="telephone=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{{ title }}</title>
    <style>
        :root {
            --bg-gradient-start: #f5f5f5;
            --bg-gradient-end: #ffffff;
            --container-bg: #ffffff;
            --container-shadow: rgba(0, 0, 0, 0.1);
            --title-color: #333;
            --text-color: #666;
            --text-muted: #999;
            --qrcode-bg: #f8f9fa;
            --accent-color: #667eea;
        }

        [data-theme="dark"] {
            --bg-gradient-start: #1a1a2e;
            --bg-gradient-end: #16213e;
            --container-bg: #252542;
            --container-shadow: rgba(0, 0, 0, 0.4);
            --title-color: #e8e8e8;
            --text-color: #b8b8b8;
            --text-muted: #888;
            --qrcode-bg: #2d2d4a;
            --accent-color: #8b9cf9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
            min-height: 100vh;
            min-height: -webkit-fill-available;
        }

        .container {
            background: var(--container-bg);
            border-radius: 16px;
            box-shadow: 0 10px 40px var(--container-shadow);
            padding: 32px 24px;
            text-align: center;
            max-width: 360px;
            width: 100%;
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 20px;
            color: var(--title-color);
            font-weight: 600;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-color);
        }

        .qrcode-wrapper {
            background: var(--qrcode-bg);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .qrcode-wrapper img {
            width: 100%;
            max-width: 240px;
            height: auto;
            border-radius: 8px;
        }

        .tips {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .tips strong {
            color: var(--accent-color);
        }

        .error-container {
            padding: 40px 20px;
        }

        .error-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }

        .error-msg {
            font-size: 16px;
            color: var(--text-color);
        }

        {% block extra_style %}{% endblock %}
    </style>
</head>
<body>
    {% block content %}{% endblock %}

    {% block script %}{% endblock %}
</body>
</html>
