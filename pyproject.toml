[project]
name = "fastapi-best-architecture"
description = "FastAPI 企业级后端架构解决方案"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Wu Clan", email = "jianhengwu0407@gmail.com" },
]
dependencies = [
  "alembic>=1.20.1",
  "asgiref>=3.13.0",
  "asyncpg>=0.32.0",
  "bcrypt>=5.0.0",
  "cappa>=0.33.0",
  "celery>=5.7.0",
  # When celery version < 6.0.0
  # https://github.com/celery/celery/issues/7874
  "celery-aio-pool>=0.1.0rc8",
  "cryptography>=50.0.2",
  "dulwich>=1.2.21",
  "fast-captcha>=0.3.2",
  "fastapi-pagination[sqlalchemy]>=0.16.2",
  "fastapi-redis-sdk[otel]>=0.9.1",
  "fastapi[standard-no-fastapi-cloud-cli]>=0.162.5",
  "flower>=2.2.0",
  "gevent>=26.9.0",
  "granian>=2.8.8",
  "itsdangerous>=2.2.0",
  "jinja2>=3.1.6",
  "loguru>=0.8.0",
  "msgspec>=0.22.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.45.2",
  "opentelemetry-instrumentation-asyncio>=0.66b2",
  "opentelemetry-instrumentation-celery>=0.66b2",
  "opentelemetry-instrumentation-httpx>=0.66b2",
  "opentelemetry-instrumentation-logging>=0.66b2",
  "opentelemetry-instrumentation-redis>=0.66b2",
  "opentelemetry-instrumentation-sqlalchemy>=0.66b2",
  "opentelemetry-sdk>=1.45.2",
  # kombu 5.7 起不再传递依赖 packaging，插件依赖检测模块直接使用，需显式声明
  "packaging>=25.0",
  "prometheus-client>=0.26.0",
  "psutil>=7.2.2",
  # https://github.com/fastapi-practices/fastapi_best_architecture/issues/887
  "psycopg[binary]==3.2.10",
  "pwdlib>=0.3.1",
  "py-ip2region>=3.0.6",
  "pydantic>=2.14.3",
  "pydantic-settings>=2.16.2",
  "pyjwt>=2.15.1",
  "python-socketio>=5.18.1",
  "redis[hiredis]>=8.1.0",
  "rtoml>=0.14.0",
  "sqlalchemy-crud-plus>=1.13.3",
  "sqlalchemy[asyncio]>=2.1.8",
  "sqlparse>=0.6.1",
  "starlette-context>=0.5.1",
  "user-agents>=2.2.0",
  # Custom dependencies (added for project-specific features)
  "cachebox>=5.0.0",
  "python-jose>=3.5.0",  # openauth 插件仍使用独立 JWT 协议
  "opentelemetry-instrumentation-fastapi>=0.66b2",
  # Installed custom plugins: keep these in the project lock and requirements export.
  "pydantic-ai-slim[openai,anthropic]>=1.38.0",
  "idna>=3.10,<3.17",
  "fastapi-oauth20>=0.0.2",
  "oss2==2.19.1",
  "qiniu==7.14.0",
  "python-docx>=1.1.0",
  "docxtpl>=0.16.0",
  "latex2mathml>=3.77.0",
  "tencentcloud-sdk-python==3.0.1029",
  "aiohttp>=3.9.0",
  "beautifulsoup4>=4.13.5",
  "botocore>=1.42.33",
  "cozepy>=0.1.0",
  "croniter>=6.0.0",
  "firebase-admin>=6.5.0",
  "flet>=0.28.3",
  "httpx>=0.28.1",
  "jieba>=0.42.1",
  "mcp>=1.2.0",
  "openai>=1.57.4",
  "openpyxl>=3.1.5",
  "pandas>=2.3.3",
  "pgvector>=0.3.6",
  "playwright>=1.40.0",
  "pymupdf>=1.24.0",
  "requests>=2.32.4",
  "sse-starlette>=2.1.3",
  "fastapi-limiter>=0.1.6",
  # [ Plugin ] notify 多渠道通知
  "aiosmtplib>=3.0.0",
  "serverchan-sdk>=0.3.0",
  # [ App ] 微信支付 V3
  "wechatpayv3>=1.2.44",
  # [ App ] 单词本 FSRS 间隔重复算法
  "fsrs>=6.3.1",
  "akshare>=1.18.64",
  "pydantic-ai>=2.0.0",
]
dynamic = ["version"]

[project.scripts]
fba = "backend.cli:main"

[dependency-groups]
dev = [
  "aiosqlite>=0.22.1",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.0",
  "pytest-sugar>=1.1.1",
]
lint = [
  "prek>=0.5.10",
  "ruff>=0.15.0",
]
server = [
  "aio-pika>=10.1.1",
  "wait-for-it>=2.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.alembic]
script_location = "%(here)s/backend/alembic"
file_template = "%%(year)d-%%(month).2d-%%(day).2d-%%(hour).2d_%%(minute).2d_%%(second).2d-%%(rev)s_%%(slug)s"
prepend_sys_path = ["."]
version_locations = ["%(here)s/backend/alembic/versions"]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.hatch.version]
path = "backend/__init__.py"

[tool.ruff]
line-length = 120
preview = true
fix = false
unsafe-fixes = false
show-fixes = true
required-version = ">=0.15.0"

[tool.ruff.lint]
select = [
  "FAST",
  "missing-type-function-argument",
  "missing-return-type-undocumented-public-function",
  "missing-return-type-private-function",
  "missing-return-type-special-method",
  "missing-return-type-static-method",
  "missing-return-type-class-method",
  "async-busy-wait",
  "long-sleep-not-forever",
  "blocking-http-call-in-async-function",
  "blocking-http-call-httpx-in-async-function",
  "blocking-open-call-in-async-function",
  "blocking-path-method-in-async-function",
  "blocking-input-in-async-function",
  "blocking-sleep-in-async-function",
  "suspicious-url-open-usage",
  "boolean-type-hint-positional-argument",
  "boolean-default-value-positional-argument",
  "unary-prefix-increment-decrement",
  "strip-with-multi-characters",
  "mutable-argument-default",
  "unused-loop-control-variable",
  "function-call-in-default-argument",
  "get-attr-with-constant",
  "set-attr-with-constant",
  "redundant-tuple-in-exception-handler",
  "duplicate-handler-exception",
  "cached-instance-method",
  "loop-variable-overrides-iterator",
  "f-string-docstring",
  "abstract-base-class-without-abstract-method",
  "duplicate-try-block-exception",
  "star-arg-unpacking-after-keyword-arg",
  "empty-method-without-abstract-decorator",
  "mutable-contextvar-default",
  "COM",
  "unnecessary-generator-dict",
  "unnecessary-list-comprehension-set",
  "unnecessary-list-comprehension-dict",
  "unnecessary-collection-call",
  "unnecessary-literal-within-list-call",
  "unnecessary-list-call",
  "unnecessary-double-cast-or-process",
  "unnecessary-comprehension",
  "unnecessary-map",
  "unnecessary-literal-within-dict-call",
  "unnecessary-comprehension-in-call",
  "unnecessary-dict-comprehension-for-iterable",
  "DTZ",
  "EXE",
  "single-line-implicit-string-concatenation",
  "multi-line-implicit-string-concatenation",
  "explicit-string-concatenation",
  "PIE",
  "pass-statement-stub-body",
  "non-empty-stub-body",
  "typed-argument-default-in-stub",
  "pass-in-class-body",
  "ellipsis-in-non-empty-class-body",
  "duplicate-union-member",
  "complex-assignment-in-stub",
  "custom-type-var-for-self",
  "quoted-annotation-in-stub",
  "docstring-in-stub",
  "collections-named-tuple",
  "type-alias-without-annotation",
  "unnecessary-literal-union",
  "legacy-type-comment",
  "non-self-return-type",
  "bad-exit-annotation",
  "redundant-numeric-union",
  "snake-case-type-alias",
  "unnecessary-type-union",
  "redundant-none-literal",
  "duplicate-literal-member",
  "pep484-style-positional-only-parameter",
  "bad-quotes-multiline-string",
  "bad-quotes-docstring",
  "unnecessary-paren-on-raise-exception",
  "unnecessary-return-none",
  "superfluous-else-return",
  "superfluous-else-raise",
  "superfluous-else-continue",
  "superfluous-else-break",
  "duplicate-isinstance-call",
  "collapsible-if",
  "needless-bool",
  "return-in-try-except-finally",
  "if-else-block-instead-of-if-exp",
  "compare-with-tuple",
  "reimplemented-builtin",
  "if-with-same-arms",
  "open-file-with-context-handler",
  "negate-equal-op",
  "negate-not-equal-op",
  "if-expr-with-true-false",
  "if-expr-with-false-true",
  "if-expr-with-twisted-arms",
  "yoda-conditions",
  "if-else-block-instead-of-dict-get",
  "dict-get-with-none-default",
  "relative-imports",
  "TC",
  "FLY",
  "I",
  "complex-structure",
  "N",
  "PERF",
  "E",
  "W",
  "docstring-starts-with-this",
  "undocumented-param",
  "empty-docstring",
  "F",
  "PGH",
  "compare-to-empty-string",
  "UP",
  "FURB",
  "RUF",
  "TRY",
]
ignore = [
  "missing-trailing-comma",
  "blanket-type-ignore",
  "ambiguous-unicode-character-string",
  "ambiguous-unicode-character-docstring",
  "ambiguous-unicode-character-comment",
  "asyncio-dangling-task",
  "mutable-class-default",
  "non-empty-init-module",
  "error-instead-of-exception",
  "raise-vanilla-args",
  "raise-within-try",
]

[tool.ruff.lint.per-file-ignores]
"**/model/*.py" = ["typing-only-standard-library-import"]
"backend/common/socketio/server.py" = ["missing-type-function-argument"]
"backend/common/exception/exception_handler.py" = [
  "missing-return-type-private-function",
  "unused-async",
]

[tool.ruff.lint.flake8-pytest-style]
parametrize-names-type = "list"
parametrize-values-row-type = "list"
parametrize-values-type = "list"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
  "pydantic.BaseModel",
  "sqlalchemy.orm.DeclarativeBase",
]

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.isort]
case-sensitive = true
lines-between-types = 1
order-by-type = true

[tool.ruff.lint.pylint]
allow-dunder-method-names = ["__tablename__", "__table_args__"]

[tool.ruff.format]
docstring-code-format = true
quote-style = "single"

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
warn_unused_configs = true
ignore_missing_imports = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
check_untyped_defs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
sqlite_cache = false
disable_error_code = [
  "import-untyped",
]
exclude = [
  "^backend/alembic/",
  "^backend/migrations/",
  "^backend/static/",
  "^backend/locale/",
  "^backend/log/",
  "^backend/tests/",
  "^backend/scripts/",
  "^backend/test_.*\\.py$",
  ".*/test_.*\\.py$",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--tb=short -v"
testpaths = ["backend"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
branch = true
source = ["backend"]
omit = [
  "backend/alembic/*",
  "backend/migrations/*",
  "backend/static/*",
  "backend/locale/*",
  "backend/tests/*",
  "backend/log/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 60
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]

[tool.bandit]
exclude_dirs = [
  "backend/alembic",
  "backend/migrations",
  "backend/static",
  "backend/tests",
  ".venv",
]
skips = [
  "B101",
]

[tool.tombi]
toml-version = "v1.1.0"

[tool.uv]
index-strategy = "unsafe-best-match"
python-downloads = "manual"
default-groups = ["dev", "lint"]

[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple"
